[package]
name = "license-signer"
version = "0.1.0"
edition = "2021"
description = "CTARTech ZentyCore - Developer Desktop License Generator & Airgap Ed25519 Signer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
